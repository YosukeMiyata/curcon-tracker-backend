name: Convex Daily Aggregation (JST 00:30)

on:
  schedule:
    # JST 毎日00:30 = UTC 15:30
    - cron: "30 15 * * *"
  workflow_dispatch: {}

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log schedule context
        run: |
          echo "event=${{ github.event_name }}"
          echo "run_id=${{ github.run_id }}"
          echo "utc=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "jst=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Setup Chromedriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily aggregation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_DAILY_ONLY: "true"
          TARGET_HOUR: "0"
          TARGET_MINUTE: "30"
          TARGET_TOLERANCE_MINUTES: "10"
        run: |
          python data_acquisition_system/convex_ec2_complete.py

