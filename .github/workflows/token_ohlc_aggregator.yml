name: Token OHLC Aggregator (JST 00:00)

on:
  schedule:
    # JST 毎日00:00 = UTC 15:00
    - cron: "0 15 * * *"
  workflow_dispatch: {}

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run token OHLC aggregation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TARGET_HOUR: "0"
          TARGET_MINUTE: "0"
          TARGET_TOLERANCE_MINUTES: "10"
        run: |
          python data_acquisition_system/token_price_tracker/token_ohlc_aggregator.py
          
