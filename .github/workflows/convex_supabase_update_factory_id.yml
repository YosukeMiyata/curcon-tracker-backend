# 対応表更新後、Supabase の既存データに factory_id を付与し失敗プールをクリア
# 手順: manual_pool_mapping.json を更新して push → 本ワークフローを手動実行
name: Convex (Supabase) - Update factory_id

on:
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update Convex factory_id (Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python data_acquisition_system/update_convex_tables_supabase.py
