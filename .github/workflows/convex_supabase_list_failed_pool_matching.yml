# Supabase の失敗プール一覧を確認（factory_id 未マッチ）
# 手動実行: Actions → Convex (Supabase) → List failed pool matching → Run workflow
name: Convex (Supabase) - List failed pool matching

on:
  workflow_dispatch: {}

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: List failed pool matching
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python data_acquisition_system/list_failed_pool_matching_supabase.py
